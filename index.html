<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UNL Rentals">
<title>UNL Holdings LLC | Rental Management</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f3; --card:#ffffff; --ink:#0a0a0a; --ink2:#3f3f46; --muted:#6b6b73; --line:#e3e3e6; --field:#f8f8f9;
  --red:#c8102e; --red-soft:#fbe8eb; --chrome:#000000; --chrome-ink:#ffffff; --chrome-muted:#a3a3ab; --chrome-line:#1c1c1e;
  --ok:#15803d; --ok-soft:#e6f4eb; --warn:#a15c07; --warn-soft:#fbf1e1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0f; --card:#171719; --ink:#f4f4f5; --ink2:#d4d4d8; --muted:#a1a1aa; --line:#2a2a2e; --field:#1f1f22;
    --red:#e8293f; --red-soft:#3a1218; --ok:#4ade80; --ok-soft:#12291b; --warn:#f2a93b; --warn-soft:#33240c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e0f; --card:#171719; --ink:#f4f4f5; --ink2:#d4d4d8; --muted:#a1a1aa; --line:#2a2a2e; --field:#1f1f22;
  --red:#e8293f; --red-soft:#3a1218; --ok:#4ade80; --ok-soft:#12291b; --warn:#f2a93b; --warn-soft:#33240c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--chrome);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:var(--red)}
.app{display:flex;flex-direction:column;height:100%}
.main{flex:1;display:flex;min-height:0}
.side{width:240px;background:var(--chrome);overflow-y:auto;flex-shrink:0;border-top:1px solid var(--chrome-line);padding-bottom:16px}
.content{flex:1;overflow-y:auto;min-width:0;-webkit-overflow-scrolling:touch}
.wrap{max-width:1140px;margin:0 auto;padding:26px 26px 56px}
.bnav{display:none}
.show-sm{display:none}
.brand svg{display:block;width:100%;height:100%}
@media (max-width:420px){.wordmark{width:176px !important;height:15.5px !important}}
.num{font-variant-numeric:tabular-nums}
.cond{font-stretch:72%}
.grid{display:grid;gap:14px}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:18px}
.g-2{display:grid;gap:18px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.click{cursor:pointer}
.click:hover{background:var(--field)}
.etable{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:10px;align-items:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal{background:var(--card);color:var(--ink);width:100%;max-height:100%;display:flex;flex-direction:column;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;padding:11px 18px;border-radius:8px;font-weight:700;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
@media (min-width:761px){.toast{bottom:28px}}
@media (max-width:900px){.g-2{grid-template-columns:1fr}}
@media (max-width:760px){
  .side{display:none}
  .bnav{display:flex}
  .wrap{padding:18px 14px 36px}
  .hide-sm{display:none !important}
  .show-sm{display:inline}
  .etable{grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr))}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:94%}
}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>

/* ── Helpers ─────────────────────────────────────────────────────── */
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(/[$,\s]/g, "")); return isNaN(n) ? 0 : n; };
const pad = n => String(n).padStart(2, "0");
const isoOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => isoOf(new Date());
const ymNow = () => today().slice(0, 7);
const d10 = s => s ? String(s).slice(0, 10) : "";
const parts = s => d10(s).split("-").map(Number);
const addDays = (s, n) => { const [y, m, d] = parts(s); return isoOf(new Date(y, m - 1, d + n)); };
const addMonths = (s, n) => { const [y, m, d] = parts(s); return isoOf(new Date(y, m - 1 + n, d)); };
const monthEnd = ym => { const [y, m] = ym.split("-").map(Number); return isoOf(new Date(y, m, 0)); };
const ymShift = (ym, k) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const ymLabel = (ym, short) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: short ? "short" : "long", year: "numeric" }); };
const fmtDate = s => { if (!d10(s)) return "—"; const [y, m, d] = parts(s); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
const daysBetween = (a, b) => Math.round((new Date(d10(b) + "T00:00:00") - new Date(d10(a) + "T00:00:00")) / 86400000);
const daysUntil = s => daysBetween(today(), s);
const money = (n, cents) => (num(n) < 0 ? "-" : "") + "$" + Math.abs(num(n)).toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ── Lease & rent logic ──────────────────────────────────────────── */
function leaseState(l) {
  const t = today(), s = d10(l.startDate), en = d10(l.endDate), mo = d10(l.moveOutDate);
  if (mo && mo < t) return "Ended";
  if (l.terminated === "Yes" && !mo) return "Ended";
  if (s && s > t) return "Upcoming";
  if (en && en < t) return l.monthToMonth === "Yes" ? "Month-to-month" : (mo ? "Active" : "Expired");

}

const isDeposit = p => CONFIG.depositTypes.indexOf(p.type) > -1;
const appliesToRent = p => !isDeposit(p) && CONFIG.nonRentTypes.indexOf(p.type) === -1;
const termText = l => fmtDate(l.startDate) + " – " + (d10(l.endDate) ? fmtDate(l.endDate) : "open-ended");

function leaseCoversMonth(l, ym) {
  const s = d10(l.startDate); if (!s) return false;
  const first = ym + "-01", last = monthEnd(ym);
  if (s > last) return false;
  let endEff = d10(l.moveOutDate) || (l.monthToMonth === "Yes" ? "" : d10(l.endDate));
  if (l.terminated === "Yes" && !d10(l.moveOutDate)) endEff = d10(l.endDate) || s;
  if (endEff && endEff < first) return false;
  return true;
}

function rentStatus(l, ym, due, paid) {
  if (due <= 0) return ["No charge", "muted"];
  if (paid >= due - 0.01) return ["Paid", "ok"];
  const dd = Math.min(Math.max(parseInt(l.dueDay, 10) || 1, 1), 28);
  let dueDate = ym + "-" + pad(dd);
  const s = d10(l.startDate);
  if (s > dueDate) dueDate = s;
  const lateAfter = addDays(dueDate, parseInt(l.graceDays, 10) || 0);
  const t = today();
  if (t > lateAfter) return [paid > 0 ? "Partial, late" : "Late", "red"];

}

  const leases = db.leases.filter(l => l.estateId === estateId);
  const occupied = props.filter(p => leases.some(l => l.propertyId === p.id && isOccupying(l))).length;
  const cur = leases.filter(l => leaseCoversMonth(l, ym));
  const pays = db.payments.filter(p => p.estateId === estateId);
  const income = sum(pays.filter(p => !isDeposit(p) && d10(p.date).slice(0, 4) === yr), p => num(p.amount));
  const expenses = sum(db.expenses.filter(x => x.estateId === estateId && d10(x.date).slice(0, 4) === yr), x => num(x.amount));
  return {
    units: props.length, occupied,
    rentRoll: sum(cur, monthlyCharge),
    collected: sum(cur, l => paidFor(db, l.id, ym)),
    income, expenses, noi: income - expenses,
    deposits: sum(leases.filter(l => leaseState(l) !== "Ended"), l => sum(pays.filter(p => p.leaseId === l.id && isDeposit(p)), p => num(p.amount))),
  };
}

function docStatus(d) {
  if (!d10(d.dueDate)) return ["On file", "muted"];
  const n = daysUntil(d.dueDate);
  if (n < 0) return ["Expired " + fmtDate(d.dueDate), "red"];
  if (n <= CONFIG.docWarnDays) return ["Due in " + plural(n, "day"), "warn"];
  return ["Valid to " + fmtDate(d.dueDate), "ok"];
}

function buildAlerts(db, estateId) {
  const t = today(), ym = ymNow(), out = [];
  const inScope = r => estateId == null || r.estateId === estateId;
  const where = r => estateId == null ? estateName(db, r.estateId) : "";
  const link = (r, tab) => r.estateId === HOLDING ? { view: "management", tab } : { view: "estate", estateId: r.estateId, tab };

  db.leases.filter(inScope).forEach(l => {
    const st = leaseState(l), pl = propLabel(propById(db, l.propertyId));
    if (st === "Expired") out.push({ sev: 2, tone: "red", title: "Lease expired: " + l.tenantName, sub: pl + " ended " + fmtDate(l.endDate) + ". Renew it or record the move-out.", who: where(l), go: link(l, "leases") });
    if (st === "Active" && d10(l.endDate) && l.monthToMonth !== "Yes" && !d10(l.moveOutDate)) {
      const n = daysUntil(l.endDate);
      if (n >= 0 && n <= CONFIG.leaseExpiryWarnDays) out.push({ sev: 1, tone: "warn", title: "Lease ends in " + plural(n, "day"), sub: l.tenantName + " at " + pl + ", " + fmtDate(l.endDate), who: where(l), go: link(l, "leases") });
    }
    if (leaseCoversMonth(l, ym)) {
      const due = monthlyCharge(l), paid = paidFor(db, l.id, ym), rs = rentStatus(l, ym, due, paid);
      if (rs[1] === "red") out.push({ sev: 3, tone: "red", title: "Rent late: " + l.tenantName, sub: money(due - paid, true) + " outstanding for " + ymLabel(ym) + " at " + pl, who: where(l), go: link(l, "ledger") });
    }
  });
  db.maintenance.filter(inScope).forEach(m => {
    if (m.status !== "Completed" && (m.priority === "Urgent" || m.priority === "High"))
      out.push({ sev: m.priority === "Urgent" ? 3 : 2, tone: m.priority === "Urgent" ? "red" : "warn", title: m.priority + " repair: " + m.title, sub: propLabel(propById(db, m.propertyId)) + ", " + (m.status || "Open").toLowerCase(), who: where(m), go: link(m, "maintenance") });
  });
  db.documents.filter(inScope).forEach(d => {
    if (!d10(d.dueDate)) return;
    const n = daysUntil(d.dueDate);
    if (n < 0) out.push({ sev: 2, tone: "red", title: "Expired: " + d.name, sub: (d.type || "Document") + ", expired " + fmtDate(d.dueDate), who: where(d), go: link(d, "documents") });
    else if (n <= CONFIG.docWarnDays) out.push({ sev: 1, tone: "warn", title: d.name + " due in " + plural(n, "day"), sub: (d.type || "Document") + ", " + fmtDate(d.dueDate), who: where(d), go: link(d, "documents") });
  });
  db.tasks.filter(inScope).forEach(k => {
    if (k.status !== "Done" && d10(k.dueDate) && d10(k.dueDate) < t)
      out.push({ sev: 1, tone: "warn", title: "Overdue task: " + k.task, sub: "Was due " + fmtDate(k.dueDate), who: where(k), go: link(k, "tasks") });
  });
  return out.sort((a, b) => b.sev - a.sev);
}

/* ── Storage / API ───────────────────────────────────────────────── */
const EMPTY = () => COLLECTIONS.reduce((o, k) => { o[k] = []; return o; }, {});
function normalize(data) {
  const db = EMPTY();
  COLLECTIONS.forEach(k => {
    db[k] = (data && Array.isArray(data[k]) ? data[k] : []).filter(r => r && r.id).map(r => {
      const o = {}; Object.keys(r).forEach(f => { o[f] = r[f] == null ? "" : (typeof r[f] === "number" ? String(r[f]) : r[f]); }); return o;
    });
  });
  return db;
}

async function api(pin, action, extra) {
  const res = await fetch(CONFIG.apiUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ pin, action }, extra || {})),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

  if (f.type === "lease") {
    const ls = ctx.db.leases.filter(l => l.estateId === ctx.estateId || !ctx.estateId);
    const rank = l => ({ "Active": 0, "Month-to-month": 0, "Expired": 1, "Upcoming": 1, "Ended": 2 })[leaseState(l)];
    return ls.slice().sort((a, b) => rank(a) - rank(b)).map(l => ({ value: l.id, label: l.tenantName + " (" + propLabel(propById(ctx.db, l.propertyId)) + ")" + (leaseState(l) === "Ended" ? ", ended" : "") }));

}

function FormModal({ kind, record, defaults, estateId, title, onClose }) {
  const app = useApp();
  const sc = SCHEMAS[kind];
  const [v, setV] = useState(() => Object.assign({}, sc.defaults ? sc.defaults() : {}, defaults || {}, record || {}));
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const ctx = { db: app.db, estateId: v.estateId || estateId, v };
  const set = (k, val) => setV(o => {
    const n = Object.assign({}, o, { [k]: val });
    const patch = sc.onChange ? sc.onChange(k, val, n, ctx) : null;
    return patch ? Object.assign(n, patch) : n;
  });
  const submit = async () => {
    for (const f of sc.fields) {
      if (f.req && !(f.showIf && !f.showIf(ctx)) && !String(v[f.k] || "").trim()) { setErr(f.label + " is required."); return; }

/* ── App ─────────────────────────────────────────────────────────── */
function App() {
  const [authed, setAuthed] = useState(false);
  const [pin, setPin] = useState("");
  const [db, setDb] = useState(EMPTY);
  const [loginBusy, setLoginBusy] = useState(false);
  const [loginErr, setLoginErr] = useState("");
  const [nav, setNav] = useState({ view: "management", tab: "overview", estateId: null });
  const [modal, setModal] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const toastTimer = useRef(null);
  const contentRef = useRef(null);

  const toast = (msg, bad) => {
    setToastMsg({ msg, bad });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2800);
  };

  const unlock = async p => {
    setLoginBusy(true); setLoginErr("");
    try {
      const d = await api(p, "getAll");
      setDb(normalize(d.data));
      setPin(p); setAuthed(true);
    } catch (err) {
      setLoginErr(/unauthor/i.test(err.message) ? "That PIN didn't work. Try again." : "Couldn't reach the server: " + err.message);
    }
    setLoginBusy(false);
  };

  const save = async (coll, rec) => {
    const now = new Date().toISOString();
    const r = Object.assign({}, rec, { id: rec.id || uid(coll.slice(0, 4)), updatedAt: now }, rec.createdAt ? null : { createdAt: now });
    setDb(d => Object.assign({}, d, { [coll]: d[coll].some(x => x.id === r.id) ? d[coll].map(x => x.id === r.id ? r : x) : d[coll].concat([r]) }));
    try { await api(pin, "upsert", { collection: coll, record: r }); } catch (err) { toast("Not saved to the Sheet: " + err.message, true); }
    return r;
  };
  const remove = async (coll, id) => {
    setDb(d => Object.assign({}, d, { [coll]: d[coll].filter(x => x.id !== id) }));
    try { await api(pin, "remove", { collection: coll, id }); } catch (err) { toast("Not deleted from the Sheet: " + err.message, true); }
  };
  const removeEstate = async id => {
    setDb(d => { const n = Object.assign({}, d); COLLECTIONS.forEach(k => { n[k] = d[k].filter(x => k === "estates" ? x.id !== id : x.estateId !== id); }); return n; });
    go({ view: "estates" });
    toast("LLC deleted");
    try {
      await Promise.all(COLLECTIONS.filter(k => k !== "estates" && k !== "vendors").map(k => api(pin, "removeWhere", { collection: k, field: "estateId", value: id })));
      await api(pin, "remove", { collection: "estates", id });
    } catch (err) { toast("Delete didn't finish in the Sheet: " + err.message, true); }
  };
  const lock = () => { setAuthed(false); setPin(""); setDb(EMPTY()); setModal(null); setNav({ view: "management", tab: "overview", estateId: null }); };

  const go = n => {
    setNav(Object.assign({ tab: "overview", estateId: null }, n));
    if (contentRef.current) contentRef.current.scrollTop = 0;
  };
  const openForm = (kind, record, opts) => setModal(Object.assign({ type: "form", kind, record: record || null }, opts || {}));
  const confirm = (text, onYes, yes) => setModal({ type: "confirm", text, onYes, yes });
  const openLease = leaseId => setModal({ type: "lease", leaseId });
  const close = () => setModal(null);

  if (!authed) return e(Login, { onUnlock: unlock, busy: loginBusy, error: loginErr });

  const ctx = { db, nav, go, save, remove, removeEstate, lock, openForm, confirm, openLease, toast };
  const view = nav.view === "estates" ? e(EstatesView)
    : nav.view === "estate" ? e(EstateView)
    : nav.view === "vendors" ? e(VendorsView)
    : e(ManagementView);

  let modalEl = null;
  if (modal && modal.type === "form") modalEl = e(FormModal, { key: modal.kind + (modal.record ? modal.record.id : "new") + (modal.title || ""), kind: modal.kind, record: modal.record, defaults: modal.defaults, estateId: modal.estateId || (modal.record && modal.record.estateId), title: modal.title, onClose: close });
  if (modal && modal.type === "confirm") modalEl = e(ConfirmModal, { text: modal.text, yes: modal.yes, onYes: modal.onYes, onClose: close });
  if (modal && modal.type === "lease") modalEl = e(LeaseDetail, { leaseId: modal.leaseId, onClose: close });

  return e(Ctx.Provider, { value: ctx },
    e("div", { className: "app" },
      e(Header),
      e("div", { className: "main" },
        e(Sidebar),
        e("main", { className: "content", ref: contentRef }, view)),
      e(BottomNav)),
    modalEl,
    toastMsg ? e("div", { className: "toast", role: "status", style: { background: toastMsg.bad ? "var(--red)" : "var(--ink)", color: toastMsg.bad ? "#fff" : "var(--card)" } }, toastMsg.msg) : null);
}
